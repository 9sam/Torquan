<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torquan - Game</title>
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
    <div id="gameContainer">
        <canvas id="renderCanvas"></canvas>

        <!-- Game UI -->
        <div class="game-ui">
            <!-- Top Bar -->
            <div class="game-top-bar">
                <div class="game-logo">
                    <i class="fas fa-cube"></i>
                    <span>Torquan</span>
                </div>
                <div class="game-controls">
                    <button class="game-btn" onclick="toggleTorquanMenu()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="game-btn" onclick="exitGame()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Chat (always visible in top left) -->
            <div class="chat-container active" id="chatContainer">
                <div class="chat-header">
                    <span>Chat</span>
                    <button class="close-btn" onclick="toggleChat()">&times;</button>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="handleChatKeyPress(event)">
                    <button onclick="sendChatMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Torquan Menu Panel -->
            <div class="torquan-menu" id="torquanMenu">
                <div class="menu-header">
                    <span>Torquan Menu</span>
                    <button class="close-btn" onclick="toggleTorquanMenu()">&times;</button>
                </div>
                <div class="menu-tabs">
                    <button class="menu-tab active" onclick="showMenuTab('players')">Players</button>
                    <button class="menu-tab" onclick="showMenuTab('graphics')">Graphics</button>
                    <button class="menu-tab" onclick="showMenuTab('avatar')">Avatar</button>
                </div>
                <div class="menu-content">
                    <!-- Players Tab -->
                    <div class="menu-tab-content active" id="playersTab">
                        <div class="player-list-content" id="playerListContent"></div>
                    </div>
                    <!-- Graphics Tab -->
                    <div class="menu-tab-content" id="graphicsTab">
                        <div class="setting-group">
                            <label>Graphics Quality</label>
                            <select id="graphicsQuality" onchange="changeGraphicsQuality(this.value)">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="setting-group">
                            <label>Shadows</label>
                            <input type="checkbox" id="shadowsEnabled" onchange="toggleShadows(this.checked)">
                        </div>
                    </div>
                    <!-- Avatar Tab -->
                    <div class="menu-tab-content" id="avatarTab">
                        <div class="setting-group">
                            <label>Body Color</label>
                            <input type="color" id="bodyColorPicker" value="#00ff00" onchange="changeBodyColor(this.value)">
                        </div>
                        <div class="setting-group">
                            <label>Username</label>
                            <span id="settingsUsername"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Help -->
            <div class="controls-help">
                <div class="help-item">
                    <span class="key">W</span>
                    <span>Move Forward</span>
                </div>
                <div class="help-item">
                    <span class="key">S</span>
                    <span>Move Backward</span>
                </div>
                <div class="help-item">
                    <span class="key">A</span>
                    <span>Move Left</span>
                </div>
                <div class="help-item">
                    <span class="key">D</span>
                    <span>Move Right</span>
                </div>
                <div class="help-item">
                    <span class="key">Space</span>
                    <span>Jump</span>
                </div>
            </div>

            <!-- Mobile Controls -->
            <div class="mobile-controls" id="mobileControls">
                <div class="joystick-container">
                    <div class="joystick" id="joystick">
                        <div class="joystick-knob" id="joystickKnob"></div>
                    </div>
                </div>
                <div class="mobile-actions">
                    <button class="mobile-btn jump-btn" id="jumpBtn">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

        <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
